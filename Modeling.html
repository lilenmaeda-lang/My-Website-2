<script>
document.addEventListener("DOMContentLoaded", () => {
  const grid = document.getElementById("modeling-grid");
  const col1 = document.getElementById("col-1");
  const col2 = document.getElementById("col-2");
  const col3 = document.getElementById("col-3");

  const items = Array.from(grid.querySelectorAll(".grid-item"));
  const images = Array.from(grid.querySelectorAll(".grid-item img"));

  function getColumnHeight(column) {
    return column.offsetHeight;
  }

  function getShortestColumn(columns) {
    let shortest = columns[0];

    for (let i = 1; i < columns.length; i++) {
      if (getColumnHeight(columns[i]) < getColumnHeight(shortest)) {
        shortest = columns[i];
      }
    }

    return shortest;
  }

  function getImageShapeScore(item) {
    const img = item.querySelector("img");

    if (!img || !img.naturalWidth || !img.naturalHeight) {
      return 1;
    }

    const ratio = img.naturalHeight / img.naturalWidth;

    if (ratio >= 1.2) {
      return 3; // vertical
    }

    if (ratio >= 0.9) {
      return 2; // casi cuadrada
    }

    return 1; // horizontal
  }

  function chooseBestItemForColumn(pool, targetColumn, columns) {
    let bestIndex = 0;
    let bestScore = -Infinity;

    const columnHeights = columns.map(col => getColumnHeight(col));
    const targetHeight = getColumnHeight(targetColumn);
    const tallestHeight = Math.max(...columnHeights);
    const gapToTallest = tallestHeight - targetHeight;

    for (let i = 0; i < pool.length; i++) {
      const item = pool[i];
      const shapeScore = getImageShapeScore(item);

      let score = 0;

      // favorece verticales cuando la columna está más baja
      score += shapeScore * Math.max(gapToTallest, 1);

      // favorece conservar cierto orden
      score -= i * 1.25;

      // pequeño bonus a la primera opción si no hay gran diferencia
      if (i === 0) {
        score += 0.8;
      }

      if (score > bestScore) {
        bestScore = score;
        bestIndex = i;
      }
    }

    return bestIndex;
  }

  function distributeItems() {
    col1.innerHTML = "";
    col2.innerHTML = "";
    col3.innerHTML = "";

    const remaining = [...items];

    if (window.innerWidth <= 700) {
      remaining.forEach((item) => {
        col1.appendChild(item);
      });
      return;
    }

    if (window.innerWidth <= 980) {
      const columns = [col1, col2];
      const lookahead = 3;

      while (remaining.length > 0) {
        const shortest = getShortestColumn(columns);
        const pool = remaining.slice(0, Math.min(lookahead, remaining.length));
        const bestIndex = chooseBestItemForColumn(pool, shortest, columns);
        const chosenItem = remaining.splice(bestIndex, 1)[0];
        shortest.appendChild(chosenItem);
      }

      return;
    }

    const columns = [col1, col2, col3];
    const lookahead = 4;

    while (remaining.length > 0) {
      const shortest = getShortestColumn(columns);
      const pool = remaining.slice(0, Math.min(lookahead, remaining.length));
      const bestIndex = chooseBestItemForColumn(pool, shortest, columns);
      const chosenItem = remaining.splice(bestIndex, 1)[0];
      shortest.appendChild(chosenItem);
    }
  }

  function waitForImagesThenDistribute() {
    let loadedCount = 0;

    if (images.length === 0) {
      distributeItems();
      return;
    }

    images.forEach((img) => {
      if (img.complete) {
        loadedCount++;
        if (loadedCount === images.length) {
          distributeItems();
        }
      } else {
        img.addEventListener("load", () => {
          loadedCount++;
          if (loadedCount === images.length) {
            distributeItems();
          }
        });

        img.addEventListener("error", () => {
          loadedCount++;
          if (loadedCount === images.length) {
            distributeItems();
          }
        });
      }
    });
  }

  waitForImagesThenDistribute();

  let resizeTimeout;

  window.addEventListener("resize", () => {
    clearTimeout(resizeTimeout);
    resizeTimeout = setTimeout(() => {
      distributeItems();
    }, 150);
  });
});
</script>

<script>
const mainNav = document.getElementById("mainNav");
const bottomNav = document.getElementById("bottomNav");

function toggleBottomNav() {
  const navBottom = mainNav.getBoundingClientRect().bottom;
  if (navBottom <= 0) {
    bottomNav.classList.add("show");
  } else {
    bottomNav.classList.remove("show");
  }
}

window.addEventListener("scroll", toggleBottomNav);
window.addEventListener("load", toggleBottomNav);
toggleBottomNav();
</script>
