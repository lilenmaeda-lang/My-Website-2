<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Session</title>

<link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

*{box-sizing:border-box;}

body{
margin:0;
font-family:"Poppins",sans-serif;
background:#fff;
color:#000;
}

.wrap{
max-width:1500px;
margin:0 auto;
padding:30px 24px 110px;
}

/* ---------- TOP BAR ---------- */

.topbar{
display:grid;
grid-template-columns:1fr auto 1fr;
align-items:center;
padding-bottom:14px;
}

.top-left{
justify-self:start;
}

.top-center{
justify-self:center;
font-family:"Merriweather",serif;
font-size:18px;
font-weight:500;
letter-spacing:0.02em;
}

.top-right{
justify-self:end;
display:flex;
gap:18px;
}

.top-link{
text-decoration:none;
color:#111;
font-size:14px;
letter-spacing:0.12em;
text-transform:uppercase;
font-weight:400;
}

.top-right a{
font-size:16px;
color:#111;
transition:opacity .2s ease,transform .2s ease;
}

.top-right a:hover{
opacity:.6;
transform:translateY(-2px);
}

/* ---------- GRID ---------- */

.grid{
display:grid;
grid-template-columns:repeat(3,minmax(0,1fr));
gap:18px;
}

@media (max-width:1000px){
.grid{grid-template-columns:repeat(2,1fr);}
}

@media (max-width:700px){
.grid{grid-template-columns:1fr;}
}

.card{
border-radius:14px;
overflow:hidden;
background:#f2f2f2;
box-shadow:0 6px 18px rgba(0,0,0,.12);
}

.card img{
width:100%;
height:auto;
display:block;
cursor:zoom-in;
transition:transform .25s ease,opacity .25s ease;
}

.card:hover img{
transform:scale(1.01);
opacity:.95;
}

/* ---------- LIGHTBOX ---------- */

.lightbox{
position:fixed;
inset:0;
background:rgba(0,0,0,.88);
display:flex;
align-items:center;
justify-content:center;
padding:30px;
opacity:0;
pointer-events:none;
transition:opacity .25s ease;
z-index:5000;
}

.lightbox.show{
opacity:1;
pointer-events:auto;
}

.lightbox-content{
position:relative;
display:flex;
align-items:center;
justify-content:center;
max-width:94vw;
max-height:90vh;
}

.lightbox img{
max-width:94vw;
max-height:88vh;
border-radius:14px;
box-shadow:0 16px 40px rgba(0,0,0,.35);
}

.lightbox-close{
position:absolute;
top:-12px;
right:-12px;
width:42px;
height:42px;
border:none;
border-radius:999px;
background:#fff;
font-size:22px;
cursor:pointer;
}

/* ---------- NAV ARROWS ---------- */

.lightbox-arrow{
position:absolute;
top:50%;
transform:translateY(-50%);
font-size:36px;
color:white;
cursor:pointer;
user-select:none;
padding:12px;
}

.arrow-left{left:-60px;}
.arrow-right{right:-60px;}

/* ---------- BOTTOM NAV ---------- */

.bottom-nav{
position:fixed;
bottom:0;
left:0;
width:100%;
background:#fff;
border-top:1px solid #eee;
padding:18px 0;
display:flex;
justify-content:center;
align-items:center;
gap:40px;
font-size:16px;
letter-spacing:.15em;
text-transform:uppercase;
opacity:0;
pointer-events:none;
transition:opacity .3s ease;
z-index:999;
}

.bottom-nav.show{
opacity:1;
pointer-events:auto;
}

.bottom-nav a{
text-decoration:none;
color:#111;
font-weight:300;
}

.bottom-social{
display:flex;
gap:18px;
margin-left:30px;
}

</style>
</head>

<body>

<div class="wrap">

<div class="topbar" id="topBar">

<div class="top-left">
<a class="top-link" href="../../../Modeling.html">All Sessions</a>
</div>

<div class="top-center">
<span id="topTitle">Session</span>
</div>

<div class="top-right">

<a href="https://www.instagram.com/lilen_maeda" target="_blank">
<i class="fa-brands fa-instagram"></i>
</a>

<a href="https://www.youtube.com/@LilenMusic" target="_blank">
<i class="fa-brands fa-youtube"></i>
</a>

<a href="https://www.tiktok.com/@watashiwalilen" target="_blank">
<i class="fa-brands fa-tiktok"></i>
</a>

</div>

</div>

<div class="grid" id="grid"></div>

</div>

<div class="lightbox" id="lightbox">

<div class="lightbox-content">

<div class="lightbox-arrow arrow-left" id="prevBtn">&#10094;</div>

<img id="lightboxImg">

<div class="lightbox-arrow arrow-right" id="nextBtn">&#10095;</div>

<button class="lightbox-close" id="lightboxClose">×</button>

</div>

</div>

<div class="bottom-nav" id="bottomNav">

<a href="../../../Modeling.html">All Sessions</a>

<div class="bottom-social">

<a href="https://www.instagram.com/lilen_maeda" target="_blank" rel="noopener">
<i class="fa-brands fa-instagram"></i>
</a>

<a href="https://www.youtube.com/@LilenMusic" target="_blank" rel="noopener">
<i class="fa-brands fa-youtube"></i>
</a>

<a href="https://www.tiktok.com/@watashiwalilen" target="_blank" rel="noopener">
<i class="fa-brands fa-tiktok"></i>
</a>

</div>

</div>

<script src="Sessions-data.js"></script>

<script>

const titleEl=document.getElementById("topTitle");
const grid=document.getElementById("grid");

const lightbox=document.getElementById("lightbox");
const lightboxImg=document.getElementById("lightboxImg");

const prevBtn=document.getElementById("prevBtn");
const nextBtn=document.getElementById("nextBtn");

let images=[];
let currentIndex=0;

function getParam(key){
const url=new URL(window.location.href);
return url.searchParams.get(key);
}

function shuffleArray(arr){
for(let i=arr.length-1;i>0;i--){
const j=Math.floor(Math.random()*(i+1));
[arr[i],arr[j]]=[arr[j],arr[i]];
}
return arr;
}

function openLightbox(index){
currentIndex=index;
lightboxImg.src=images[currentIndex];
lightbox.classList.add("show");
document.body.style.overflow="hidden";
}

function closeLightbox(){
lightbox.classList.remove("show");
document.body.style.overflow="";
}

function nextImage(){
currentIndex=(currentIndex+1)%images.length;
lightboxImg.src=images[currentIndex];
}

function prevImage(){
currentIndex=(currentIndex-1+images.length)%images.length;
lightboxImg.src=images[currentIndex];
}

function build(){

const i=Number(getParam("i"));

const session=window.SESSIONS[i];

titleEl.textContent=session.title;

const randomized=shuffleArray([...session.images]);

grid.innerHTML="";

images=randomized.map(name=>`${session.folder}/${name}`);

images.forEach((src,index)=>{

const card=document.createElement("div");
card.className="card";

const img=document.createElement("img");
img.src=src;

img.onclick=()=>openLightbox(index);

card.appendChild(img);
grid.appendChild(card);

});

}

build();

document.getElementById("lightboxClose").onclick=closeLightbox;

lightbox.onclick=e=>{
if(e.target===lightbox)closeLightbox();
}

nextBtn.onclick=nextImage;
prevBtn.onclick=prevImage;

document.addEventListener("keydown",e=>{
if(!lightbox.classList.contains("show"))return;

if(e.key==="ArrowRight")nextImage();
if(e.key==="ArrowLeft")prevImage();
if(e.key==="Escape")closeLightbox();
});

</script>

<script>

document.addEventListener("DOMContentLoaded",()=>{

const topBar=document.getElementById("topBar");
const bottomNav=document.getElementById("bottomNav");

function toggleBottomNav(){
const bottom=topBar.getBoundingClientRect().bottom;

if(bottom<=0)bottomNav.classList.add("show");
else bottomNav.classList.remove("show");
}

window.addEventListener("scroll",toggleBottomNav);
window.addEventListener("load",toggleBottomNav);

toggleBottomNav();

});

</script>

</body>
</html>
