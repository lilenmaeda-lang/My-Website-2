<script>
// ---------- SOUND TOGGLE ----------
document.querySelectorAll('.video-container').forEach(container => {
  const video = container.querySelector('video');
  const button = container.querySelector('.soundToggle');
  if (!video || !button) return;

  button.addEventListener('click', () => {
    video.muted = !video.muted;
    button.textContent = video.muted ? '🔊' : '🔇';
  });
});

// ---------- SHOW BOTTOM NAV WHEN TOP NAV SCROLLS AWAY ----------
const mainNav = document.getElementById("mainNav");
const bottomNav = document.getElementById("bottomNav");

function toggleBottomNav() {
  const navBottom = mainNav.getBoundingClientRect().bottom;
  if (navBottom <= 0) bottomNav.classList.add("show");
  else bottomNav.classList.remove("show");
}

window.addEventListener("scroll", toggleBottomNav);
window.addEventListener("load", toggleBottomNav);

// ---------- MASONRY-STYLE VIDEO LAYOUT ----------
const actingGrid = document.getElementById("actingGrid");

function resizeVideoGridItem(item) {
  if (window.innerWidth <= 900) {
    item.style.gridRowEnd = "auto";
    return;
  }

  const gridStyles = window.getComputedStyle(actingGrid);
  const rowHeight = parseFloat(gridStyles.getPropertyValue("grid-auto-rows"));
  const rowGap = parseFloat(gridStyles.getPropertyValue("gap"));

  const itemHeight = item.getBoundingClientRect().height;
  const rowSpan = Math.ceil((itemHeight + rowGap) / (rowHeight + rowGap));

  item.style.gridRowEnd = `span ${rowSpan}`;
}

function layoutVideoGrid() {
  const items = actingGrid.querySelectorAll(".video-container");
  items.forEach((item) => resizeVideoGridItem(item));
}

function waitForVideosAndLayout() {
  const videos = actingGrid.querySelectorAll("video");
  let readyCount = 0;

  if (videos.length === 0) {
    layoutVideoGrid();
    return;
  }

  function markReady() {
    readyCount += 1;
    if (readyCount >= videos.length) {
      layoutVideoGrid();
    }
  }

  videos.forEach((video) => {
    if (video.readyState >= 1) {
      markReady();
    } else {
      video.addEventListener("loadedmetadata", markReady, { once: true });
      video.addEventListener("error", markReady, { once: true });
    }

    video.addEventListener("loadeddata", () => {
      layoutVideoGrid();
    });

    video.addEventListener("playing", () => {
      layoutVideoGrid();
    });
  });
}

waitForVideosAndLayout();

let resizeTimeout;
window.addEventListener("resize", () => {
  clearTimeout(resizeTimeout);
  resizeTimeout = setTimeout(() => {
    layoutVideoGrid();
  }, 150);
});

window.addEventListener("load", () => {
  layoutVideoGrid();
});
</script>
