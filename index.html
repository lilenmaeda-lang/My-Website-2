<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lilen Maeda - Portfolio</title>

<!-- GOOGLE FONTS -->
<link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

<!-- SOCIAL ICONS -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

body{
  margin:0;
  font-family:"Poppins",sans-serif;
  height:100vh;
}

.home{
  height:90vh;
  display:flex;
  flex-direction:column;
}

/* ---------- SOCIAL TOP RIGHT ---------- */

.home-social{
  position:absolute;
  top:26px;
  right:40px;
  display:flex;
  gap:20px;
  z-index:10;
}

.home-social a{
  font-size:18px;
  color:#111;
  transition:opacity 0.2s ease, transform 0.2s ease;
}

.home-social a:hover{
  opacity:0.6;
  transform:translateY(-2px);
}

/* ---------- GRID ---------- */

.tiles{
  flex:1;
  display:grid;
  grid-template-columns:1fr 1fr;
  grid-template-rows:1fr 1fr;
  gap:30px;

  padding: 40px 60px 40px 60px; /* SAME top/bottom */

  height: calc(100vh - 120px); /* subtract nav height */
  box-sizing: border-box;
}

.tile{
  position:relative;
  border-radius:18px;
  overflow:hidden;
  text-decoration:none;
  display:flex;
  align-items:flex-end;
  transition:transform 0.25s ease;
}

.tile:hover{
  transform:translateY(-2px);
}

.tile img{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
}

.tile .overlay{
  position:absolute;
  inset:0;
  background:linear-gradient(to top, rgba(0,0,0,0.55), rgba(0,0,0,0.05));
}

.tile .label{
  position:relative;
  z-index:2;
  padding:20px;
  width:100%;
  display:flex;
  justify-content:space-between;
  align-items:baseline;
}

.label h2{
  margin:0;
  font-family:"Merriweather",serif;
  font-size:26px;
  color:white;
}

.label span{
  font-size:12px;
  letter-spacing:0.25em;
  text-transform:uppercase;
  color:rgba(255,255,255,0.85);
}

.main-nav {
  width: 100%;
  padding: 32px 60px 0 60px;
  box-sizing: border-box;
  background: #fff;
  position: relative;
  z-index: 1000;
}

.nav-inner {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.nav-name {
  font-family: "Merriweather", serif;
  font-size: 34px;
  font-weight: 700;
  letter-spacing: 0.03em;
  text-decoration: none;
  color: #111;
}

.nav-links {
  display: flex;
  align-items: center;
}

.nav-links a {
  margin-left: 36px;
  font-weight: 300;
  font-size: 18px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  text-decoration: none;
  color: #222;
}

.nav-social {
  display: flex;
  align-items: center;
  gap: 18px;
  margin-left: 40px;
}

.nav-social a {
  font-size: 18px;
  color: #111;
  transition: opacity 0.2s ease;
}

.nav-social a:hover {
  opacity: 0.6;
}

/* ---------- MOBILE ---------- */

@media (max-width:900px){

  body{
    height:auto;
  }

  .tiles{
    grid-template-columns:1fr;
    grid-template-rows:auto;
    padding:20px;
  }

  .tile{
    height:240px;
  }

  .home-social{
    right:20px;
    top:18px;
  }

  .main-nav {
  width: 100%;
  padding: 32px 60px 0 60px;
  box-sizing: border-box;
  background: #fff;
  position: relative;
  z-index: 1000;
}

.nav-inner {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.nav-name {
  font-family: "Merriweather", serif;
  font-size: 34px;
  font-weight: 700;
  letter-spacing: 0.03em;
  text-decoration: none;
  color: #111;
}

.nav-links {
  display: flex;
  align-items: center;
}

.nav-links a {
  margin-left: 36px;
  font-weight: 300;
  font-size: 18px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  text-decoration: none;
  color: #222;
}

.nav-social {
  display: flex;
  align-items: center;
  gap: 18px;
  margin-left: 40px;
}

.nav-social a {
  font-size: 18px;
  color: #111;
  transition: opacity 0.2s ease;
}

.nav-social a:hover {
  opacity: 0.6;
}

}

</style>
</head>

<body>

   <nav class="main-nav" id="mainNav">
  <div class="nav-inner">
    <a href="index.html" class="nav-name">Lilen Maeda</a>

      <div class="nav-social">
        <a href="https://www.instagram.com/lilen_maeda" target="_blank" rel="noopener"><i class="fa-brands fa-instagram"></i></a>
        <a href="https://www.youtube.com/YOURCHANNEL" target="_blank" rel="noopener"><i class="fa-brands fa-youtube"></i></a>
        <a href="https://www.tiktok.com/@watashiwalilen" target="_blank" rel="noopener"><i class="fa-brands fa-tiktok"></i></a>
      </div>
    </div>
  </div>
</nav>

<div class="home">


<section class="tiles">

<a class="tile" href="Acting.html">
<img src="Gatorade.jpeg" alt="">
<div class="overlay"></div>
<div class="label">
<h2>Acting</h2>

</div>
</a>

<a class="tile" href="Modeling.html">
<img src="Modeling.jpg" alt="">
<div class="overlay"></div>
<div class="label">
<h2>Modeling</h2>

</div>
</a>

<a class="tile" href="Creative.html">
<img src="Luces & Sombras.jpg" alt="">
<div class="overlay"></div>
<div class="label">
<h2>Creative</h2>

</div>
</a>

<a class="tile" href="about.html">
<img src="About.jpg" alt="">
<div class="overlay"></div>
<div class="label">
<h2>About</h2>

</div>
</a>

</section>

</div>

</body>
</html>
